<!DOCTYPE html>
<html lang="{{.lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <script src="/static/js/tailwind.min.js"></script>
    <script src="/static/js/vue.global.prod.js"></script>
    <script src="/static/js/lang-switcher.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            50: '#f9fafb',
                            100: '#f3f4f6',
                            200: '#e5e7eb',
                            300: '#d1d5db',
                            400: '#9ca3af',
                            500: '#6b7280',
                            600: '#4b5563',
                            700: '#374151',
                            800: '#1f2937',
                            900: '#111827',
                            950: '#030712',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-950 min-h-screen flex items-center justify-center">
    <div id="app">
        <div class="bg-dark-900 rounded-xl shadow-2xl p-8 w-full max-w-sm border border-dark-700">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-center text-gray-100">{{.title}}</h1>
                <lang-switcher></lang-switcher>
            </div>
            <div v-if="error" class="bg-red-900/30 border border-red-700 text-red-400 px-4 py-2 rounded-lg mb-4 text-sm">
                [[ error ]]
            </div>
            <form method="POST" action="/login" @submit="handleSubmit">
                <div class="mb-4">
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-2">[[ labels.password ]]</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        v-model="password"
                        required
                        class="w-full px-3 py-2 bg-dark-800 border border-dark-600 rounded-lg text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                        :placeholder="labels.passwordPlaceholder"
                    >
                </div>
                <button 
                    type="submit"
                    :disabled="loading"
                    class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-800 disabled:cursor-not-allowed text-white font-medium rounded-lg transition duration-200 flex items-center justify-center"
                >
                    <svg v-if="loading" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    [[ loading ? labels.loggingIn : labels.login ]]
                </button>
            </form>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        const messages = {
            zh: {
                password: '登录密码',
                passwordPlaceholder: '请输入登录密码',
                login: '登录',
                loggingIn: '登录中...'
            },
            en: {
                password: 'Login Password',
                passwordPlaceholder: 'Enter login password',
                login: 'Login',
                loggingIn: 'Logging in...'
            }
        };

        createApp({
            delimiters: ['[[', ']]'],
            components: {
                'lang-switcher': LangSwitcher
            },
            data() {
                var lang = '{{.lang}}' || 'zh';
                var labels = messages[lang] || messages.zh;
                return {
                    password: '',
                    loading: false,
                    error: '{{.error}}' || '',
                    labels: labels
                }
            },
            methods: {
                handleSubmit() {
                    this.loading = true;
                    this.error = '';
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
